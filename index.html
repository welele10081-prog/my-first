<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TubeTycoon — Симулятор Ютубера</title>
<meta name="description" content="Большой симулятор ютубера: студия, темы видео, комментарии, мерч, спонсоры, команда, конкуренты, квесты, престиж, уровни и play-кнопки.">
<style>
  /* ===================== ТЕМЫ ===================== */
  :root{
    --bg0:#070907; --bg1:#0d110d; --panel:#121812; --panel2:#182018; --panelHi:#1e281e;
    --line:#263126; --line2:#334133;
    --txt:#e8f0e8; --muted:#8ea38e; --muted2:#6f846f;
    --accent:#39d353; --accent2:#2ea043; --accentInk:#04230d;
    --glow1:rgba(57,211,83,.12); --glow2:rgba(46,160,67,.10);
    --gold:#f2c14e; --silver:#c9d1d9; --diamond:#7ee3ff; --ruby:#ff5c7a; --purple:#c98bff; --blue:#5aa9ff;
    --danger:#ff6b6b; --warn:#ffcf5c;
    --radius:16px; --radius-sm:11px;
    --shadow:0 8px 30px rgba(0,0,0,.5); --shadow-sm:0 3px 12px rgba(0,0,0,.4);
    --sb:236px;
  }
  :root[data-theme="midnight"]{
    --bg0:#05070d; --bg1:#0a0f1a; --panel:#0f1522; --panel2:#141c2c; --panelHi:#1a2438;
    --line:#233047; --line2:#31425f; --txt:#e6edf7; --muted:#8497b5;
    --accent:#5aa9ff; --accent2:#2f6fd6; --accentInk:#04122b;
    --glow1:rgba(90,169,255,.14); --glow2:rgba(47,111,214,.10);
  }
  :root[data-theme="sunset"]{
    --bg0:#0d0705; --bg1:#160b08; --panel:#1a0f0b; --panel2:#231411; --panelHi:#2c1a15;
    --line:#3a231b; --line2:#4d2f24; --txt:#f6ece6; --muted:#b58f84;
    --accent:#ff8a4a; --accent2:#e0552b; --accentInk:#2b0f04;
    --glow1:rgba(255,138,74,.14); --glow2:rgba(224,85,43,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg0); color:var(--txt);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    min-height:100vh; line-height:1.45; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  #bg{position:fixed;inset:0;z-index:-2;pointer-events:none}
  body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(1200px 700px at 85% -8%,var(--glow1),transparent 60%),
               radial-gradient(1000px 600px at -10% 110%,var(--glow2),transparent 60%);}
  a{color:var(--accent)}
  .hidden{display:none !important}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}

  /* ===================== ONBOARDING ===================== */
  #onboard{max-width:760px;margin:4vh auto;padding:18px}
  .logo{font-size:clamp(30px,7vw,52px);font-weight:900;letter-spacing:-1.5px;text-align:center;margin:0 0 4px;
    background:linear-gradient(120deg,var(--txt),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .tag{text-align:center;color:var(--muted);margin:0 0 20px;font-size:15px}
  .card{background:linear-gradient(180deg,var(--panel),var(--bg1));border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .field{margin:16px 0}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  input[type=text]{width:100%;padding:13px 15px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:16px}
  input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow1)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .niches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
  .niche{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:var(--radius-sm);padding:13px;text-align:center;transition:.15s;user-select:none}
  .niche:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .niche.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow1) inset,var(--shadow-sm)}
  .niche .em{font-size:27px;display:block}
  .niche .nm{font-weight:700;margin-top:5px}
  .niche .rp{font-size:11px;color:var(--muted)}
  .avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px;margin-top:8px}
  .av-opt{cursor:pointer;aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:24px;transition:.15s;user-select:none}
  .av-opt:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .av-opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow1) inset}

  /* ===================== КНОПКИ ===================== */
  .btn{cursor:pointer;border:none;border-radius:var(--radius-sm);padding:12px 18px;font-size:15px;font-weight:700;
    background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--accentInk);transition:.15s;position:relative;overflow:hidden}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn:active{transform:translateY(1px)}
  .btn.block{width:100%;margin-top:18px;font-size:17px;padding:15px}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent);filter:none}
  .btn.sm{padding:8px 12px;font-size:13px}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  .btn.gold{background:linear-gradient(180deg,var(--gold),#c9982f);color:#2a1c00}
  .btn.purple{background:linear-gradient(180deg,var(--purple),#8f5cd6);color:#210a35}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}

  /* ===================== КАРКАС ПРИЛОЖЕНИЯ ===================== */
  #app{display:flex;min-height:100vh}
  #sidebar{width:var(--sb);flex:0 0 var(--sb);position:sticky;top:0;height:100vh;overflow-y:auto;
    background:linear-gradient(180deg,var(--panel),var(--bg1));border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:16px 12px;gap:4px;z-index:30}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
  .sb-brand .avatar{width:42px;height:42px;flex:0 0 auto}
  .sb-brand .txt{min-width:0}
  .sb-brand .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-brand .rk{font-size:11px;color:var(--muted)}
  .avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:22px;
    background:linear-gradient(135deg,var(--accent2),var(--bg1));border:1px solid var(--accent)}
  .navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;
    color:var(--muted);font-weight:600;font-size:14px;transition:.13s;border:1px solid transparent;white-space:nowrap}
  .navitem:hover{background:var(--panel2);color:var(--txt)}
  .navitem.active{background:var(--panelHi);color:var(--txt);border-color:var(--line2)}
  .navitem.active .ic{filter:drop-shadow(0 0 6px var(--accent))}
  .navitem .ic{font-size:18px;width:22px;text-align:center}
  .navitem .badge{margin-left:auto;min-width:18px;padding:0 5px;font-size:11px;border-radius:9px;background:var(--danger);color:#fff;text-align:center;font-weight:800}
  .navitem .lock{margin-left:auto;font-size:12px;opacity:.6}
  .sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}

  main{flex:1;min-width:0;display:flex;flex-direction:column}

  /* ===================== HUD (верхняя панель статов) ===================== */
  #hud{position:sticky;top:0;z-index:25;background:color-mix(in srgb,var(--bg0) 86%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 18px}
  .hud-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .hstat{display:flex;flex-direction:column;min-width:58px}
  .hstat .v{font-weight:800;font-size:16px;line-height:1.1}
  .hstat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .hstat .v.subs{color:var(--accent)} .hstat .v.money{color:var(--gold)} .hstat .v.cr{color:var(--purple)} .hstat .v.rep{color:var(--diamond)}
  .hud-spacer{flex:1}
  .lvlchip{display:flex;align-items:center;gap:7px}
  .lvlring{position:relative;width:34px;height:34px;flex:0 0 auto}
  .lvlring svg{transform:rotate(-90deg)}
  .lvlring .lv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .energy-wrap{min-width:150px;flex:1;max-width:280px}
  .energy-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px}
  .energy-bar{height:10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  .energy-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .35s;border-radius:6px}
  .icobtn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:10px;padding:7px 10px;font-size:14px;font-weight:700}
  .icobtn:hover{border-color:var(--accent)}
  .ticker{margin-top:8px;overflow:hidden;white-space:nowrap;font-size:12.5px;color:var(--muted)}
  .ticker b{color:var(--accent)}

  #view{padding:18px;max-width:1120px;width:100%;margin:0 auto;flex:1}

  /* ===================== ПАНЕЛИ / ОБЩЕЕ ===================== */
  .panel{background:linear-gradient(180deg,var(--panel),var(--bg1));border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:16px;box-shadow:var(--shadow-sm);animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .panel h2{margin:0 0 14px;font-size:19px;display:flex;align-items:center;gap:9px}
  .panel h3{margin:18px 0 9px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .grid{display:grid;gap:14px}
  .muted{color:var(--muted)} .small{font-size:13px}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .pill.hot{border-color:var(--gold);color:var(--gold)} .pill.ok{border-color:var(--accent);color:var(--accent)}

  /* KPI-плитки */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
  .kpi .box{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;transition:.2s;position:relative;overflow:hidden}
  .kpi .box:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .kpi .box .v{font-size:22px;font-weight:800} .kpi .box .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  .kpi .box .spark{margin-top:8px;height:30px}

  /* карточки видео/тем */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .tile{border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px;background:var(--panel2);cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .tile:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-sm)}
  .tile.disabled{opacity:.4;pointer-events:none} .tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow1) inset}
  .tile .big{font-size:26px;margin-bottom:5px} .tile .t{font-weight:800;font-size:15px} .tile .d{font-size:12px;color:var(--muted);margin:6px 0}
  .tile .cost{font-size:12px;color:var(--warn)} .tile.stream{border-color:var(--ruby)}
  .tile .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}

  /* list item (shop/skills/team/merch) */
  .item{display:flex;align-items:center;gap:13px;padding:13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel2);margin-bottom:10px;transition:.15s}
  .item:hover{border-color:var(--line2)}
  .item .em{font-size:27px;width:36px;text-align:center;flex:0 0 auto}
  .item .info{flex:1;min-width:0} .item .info .nm{font-weight:700} .item .info .ds{font-size:12px;color:var(--muted)}
  .lvlbar{display:flex;gap:3px;margin-top:6px} .lvlbar .seg{height:6px;flex:1;border-radius:3px;background:var(--line)} .lvlbar .seg.on{background:var(--accent)}
  .item .buy{text-align:right;white-space:nowrap;flex:0 0 auto} .item .buy .price{font-size:12px;color:var(--gold);margin-bottom:6px}

  /* лента / комментарии */
  .feed{max-height:340px;overflow:auto}
  .logline{padding:9px 12px;border-left:3px solid var(--line);margin-bottom:7px;background:var(--panel2);border-radius:0 8px 8px 0;font-size:14px}
  .logline.good{border-color:var(--accent)} .logline.bad{border-color:var(--danger)}
  .logline.viral{border-color:var(--gold);background:rgba(242,193,78,.08)} .logline.info{border-color:var(--diamond)}
  .logline .tm{font-size:11px;color:var(--muted);margin-right:6px}
  .comment{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel2);margin-bottom:9px}
  .comment .ava{width:32px;height:32px;border-radius:50%;background:var(--panelHi);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .comment .body{flex:1;min-width:0} .comment .who{font-weight:700;font-size:13px} .comment .txt{font-size:13px;color:var(--txt)}
  .comment.replied{opacity:.5}

  /* таблица */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  td.num{text-align:right;font-variant-numeric:tabular-nums} tr .vir{color:var(--gold)}

  /* рейтинг */
  .lb-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel2);margin-bottom:8px;transition:.15s}
  .lb-row:hover{border-color:var(--line2)} .lb-row.you{border-color:var(--accent);box-shadow:0 0 0 1px var(--glow1) inset}
  .lb-row .rk{font-weight:800;width:32px;color:var(--muted)} .lb-row.you .rk{color:var(--accent)}
  .lb-row .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis} .lb-row .sb{font-weight:800;color:var(--accent)}
  .lb-row .nn{font-size:11px;color:var(--muted);font-weight:400}

  /* квесты / прогресс */
  .quest{display:flex;align-items:center;gap:13px;padding:13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel2);margin-bottom:10px}
  .quest .em{font-size:23px} .quest .info{flex:1;min-width:0}
  .qbar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:7px}
  .qbar .fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .4s}
  .quest .rew{color:var(--gold);font-weight:800;white-space:nowrap;font-size:13px}
  .goalbar{margin-top:12px}
  .goalbar .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .goalbar .track{height:12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  .goalbar .fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:8px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

  /* достижения / трофеи */
  .achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .ach{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;background:var(--panel2);text-align:center;opacity:.38;transition:.25s}
  .ach.got{opacity:1;border-color:var(--accent);box-shadow:0 0 14px var(--glow1)}
  .ach .em{font-size:30px} .ach .nm{font-weight:700;font-size:13px;margin-top:5px} .ach .ds{font-size:11px;color:var(--muted)}
  .shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:11px}
  .trophy{text-align:center;border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 8px;background:var(--panel2);opacity:.35;filter:grayscale(1);transition:.35s}
  .trophy.got{opacity:1;filter:none;border-color:var(--gold);box-shadow:0 0 18px rgba(242,193,78,.18)}
  .trophy .big{font-size:34px;line-height:1} .trophy .lb{font-size:11px;color:var(--muted);margin-top:6px;font-weight:700}

  .trend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--glow1);border:1px solid var(--accent2);border-radius:var(--radius-sm);padding:9px 13px;font-size:14px}

  /* тосты / модалка / эффекты */
  #toasts{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
  .toast{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);font-weight:700;animation:pop .3s ease}
  .toast.bad{border-color:var(--danger)} .toast.gold{border-color:var(--gold)} .toast.purple{border-color:var(--purple)}
  @keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
  #modal .box{background:linear-gradient(180deg,var(--panel),var(--bg1));border:1px solid var(--line);border-radius:var(--radius);padding:22px;max-width:520px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
  #modal h3{margin:0 0 12px} #modal .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap} #modal .actions .btn{flex:1;min-width:120px}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90;display:none}
  .float-num{position:fixed;z-index:80;pointer-events:none;font-weight:800;font-size:15px;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
  @keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-46px);opacity:0}}
  canvas.chart{width:100%;display:block;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
  .seg-toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg-toggle button{background:var(--panel2);color:var(--muted);border:none;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13px}
  .seg-toggle button.on{background:var(--accent);color:var(--accentInk)}
  .hint-keys{font-size:11px;color:var(--muted);margin-top:8px} .hint-keys kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  textarea{width:100%;min-height:90px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-family:monospace;font-size:12px}

  /* нижняя навигация (мобайл) */
  #bottomnav{display:none}
  footer.credit{color:var(--muted2);font-size:12px;text-align:center;padding:14px 0 90px}

  /* ===================== АДАПТИВ ===================== */
  @media(max-width:860px){
    #sidebar{display:none}
    #view{padding:14px 14px 96px}
    #hud{padding:9px 14px}
    #bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:color-mix(in srgb,var(--bg0) 92%,transparent);
      backdrop-filter:blur(10px);border-top:1px solid var(--line);overflow-x:auto;padding:6px 8px;gap:4px}
    #bottomnav button{flex:0 0 auto;background:none;border:none;color:var(--muted);font-size:11px;font-weight:700;
      display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:10px;cursor:pointer;position:relative}
    #bottomnav button.active{color:var(--accent);background:var(--panel2)}
    #bottomnav button .ic{font-size:19px}
    #bottomnav button .badge{position:absolute;top:2px;right:6px;min-width:15px;height:15px;font-size:9px;border-radius:8px;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center}
    .hud-row{gap:12px} .hstat{min-width:auto}
    #toasts{bottom:96px}
  }
</style>
</head>

    confParts.forEach(p=>{ p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=clamp(p.life/40,0,1);ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore(); });

  const subReach=S.subs*clamp(0.20+q*0.02,0.12,0.6);

function genSponsors(){ S.sponsorOffers=[]; const n=rint(2,3); for(let i=0;i<n;i++){ const days=rint(4,9); const daily=Math.round((S.subs*rnd(0.02,0.06)+50)*pmult()); S.sponsorOffers.push({brand:pick(BRANDS),daily,days,repCost:+rnd(0.3,1.2).toFixed(1),sign:Math.round(daily*rnd(0.5,1.5))}); } S.sponsorRefresh=S.day+rint(4,7); }

  log('💼 '+(LANG==='ru'?'Контракт с ':'Contract with ')+o.brand+': '+money(o.daily)+'/'+t('day').toLowerCase()+' ×'+o.days+(o.sign>0?(' (+'+money(o.sign)+')'):''),'good'); toast('💼 '+o.brand,'gold'); sfx('coin'); S.sponsorOffers.splice(i,1); render(); save(); }

function drawChart(id,data,color){ const cv=$('#'+id); if(!cv||!cv.getContext) return; const ctx=cv.getContext('2d'),W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
  if(!data||data.length<2) return; const max=Math.max(...data,1),min=Math.min(...data,0),pad=8,rng=max-min||1;
  ctx.beginPath(); data.forEach((v,i)=>{ const x=pad+(W-2*pad)*i/(data.length-1),y=H-pad-(H-2*pad)*((v-min)/rng); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
  ctx.lineTo(pad+(W-2*pad),H-pad); ctx.lineTo(pad,H-pad); ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,color+'55'); g.addColorStop(1,color+'00'); ctx.fillStyle=g; ctx.fill(); }

  box.querySelectorAll('[data-lang]').forEach(el=>el.onclick=()=>{ LANG=el.dataset.lang; S.lang=LANG; sfx('click'); $('#modal').classList.add('hidden'); buildNav(); render(); openSettings(); });
  const vr=$('#volRange'); if(vr) vr.oninput=()=>{ S.volume=vr.value/100; $('#volLbl').textContent=vr.value+'%'; save(); };
  const cp=$('#copyBtn'); if(cp) cp.onclick=()=>{ const ta=$('#expArea'); ta.select(); try{ document.execCommand('copy'); }catch(e){} if(navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(()=>{}); toast(t('copied')); };
  const ib=$('#impBtn'); if(ib) ib.onclick=()=>{ try{ const raw=decodeURIComponent(escape(atob($('#impArea').value.trim()))); const s=JSON.parse(raw); if(!s.name||!s.niche) throw 0; S=s; LANG=S.lang||LANG; migrate(); $('#modal').classList.add('hidden'); toast(t('imported')); buildNav(); render(); save(); }catch(e){ toast(t('importBad'),'bad'); } };
  $('#resetBtn2').onclick=()=>confirmModal(t('resetQ'),t('resetT'),()=>{ localStorage.removeItem(SAVE_KEY); location.reload(); });
  $('#closeBtn').onclick=()=>$('#modal').classList.add('hidden');
}
function confirmModal(title,text,onYes){ const box=$('#modalBox'); box.innerHTML=`<h3>${title}</h3><p>${text}</p><div class="actions"><button class="btn danger" id="mNo">${t('cancel')}</button><button class="btn" id="mYes">${t('yes')}</button></div>`; $('#modal').classList.remove('hidden'); $('#mNo').onclick=()=>$('#modal').classList.add('hidden'); $('#mYes').onclick=()=>{ $('#modal').classList.add('hidden'); onYes(); }; }

/* ============================ ONBOARDING / BOOT ============================ */
let selNiche=null, selAvatar='🎬';
function buildOnboard(){ const ag=$('#avatarGrid');
  if(ag){ ag.innerHTML=AVATARS.map(a=>`<div class="av-opt ${a===selAvatar?'sel':''}" data-a="${a}">${a}</div>`).join(''); ag.querySelectorAll('.av-opt').forEach(el=>el.onclick=()=>{ sfx('click'); ag.querySelectorAll('.av-opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); selAvatar=el.dataset.a; }); }
  const grid=$('#nicheGrid'); grid.innerHTML=Object.entries(NICHES).map(([k,n])=>`<div class="niche ${k===selNiche?'sel':''}" data-n="${k}"><span class="em">${n.em}</span><span class="nm">${L(n.nm)}</span><span class="rp">RPM $${n.rpm}</span></div>`).join('');
  grid.querySelectorAll('.niche').forEach(el=>el.onclick=()=>{ sfx('click'); grid.querySelectorAll('.niche').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); selNiche=el.dataset.n; });
  applyStatic();
}
function startGame(){ const nm=$('#chanName').value.trim()||(LANG==='ru'?'Мой канал':'My channel'); if(!selNiche){ toast(t('pickNiche'),'bad'); sfx('error'); return; }
  S=freshState(nm,selNiche); S.avatar=selAvatar; ensureQuests(); genTopics(); genSponsors(); log((LANG==='ru'?'Канал «':'Channel “')+nm+(LANG==='ru'?'» создан. Удачи! 🎬':'” created. Good luck! 🎬'),'good'); save(); showGame(); }
function showGame(){ $('#onboard').classList.add('hidden'); $('#app').classList.remove('hidden'); applyTheme(); buildNav(); render(); startTicker(); startBg(); }
function toggleLang(){ LANG=LANG==='ru'?'en':'ru'; if(S){ S.lang=LANG; buildNav(); render(); } else buildOnboard(); }
function migrate(){ S.staff=S.staff||{editor:0,designer:0,writer:0,manager:0,moderator:0}; S.skills=S.skills||{editing:0,charisma:0,seo:0,thumb:0,writing:0};
  S.equip=S.equip||{camera:0,mic:0,pc:0,light:0,soft:0,studio:0}; S.merch=S.merch||{}; S.comments=S.comments||[]; S.topics=S.topics||[]; if(S.topicSel==null)S.topicSel=-1;
  S.sponsorOffers=S.sponsorOffers||[]; if(S.sponsorActive===undefined)S.sponsorActive=null; if(S.sponsorRefresh==null)S.sponsorRefresh=0;
  S.rivals=S.rivals&&S.rivals.length?S.rivals:makeRivals(); S.quests=S.quests||[]; S.questsDone=S.questsDone||0; S.prestige=S.prestige||0; S.permaBonus=S.permaBonus||0;
  S.xp=S.xp||0; S.level=S.level||levelFromXp(S.xp); S.theme=S.theme||'nature'; if(S.volume==null)S.volume=0.7; S.avatar=S.avatar||'🎬';
  if(!S.history||Array.isArray(S.history)) S.history={subs:[S.subs||0],views:[S.views||0],money:[Math.round(S.money||0)]};
  S.history.subs=S.history.subs||[0]; S.history.views=S.history.views||[0]; S.history.money=S.history.money||[0];
  S.stats=S.stats||{videosMade:0,virals:0,strikes:0,bestViews:0,streams:0,replies:0}; if(S.stats.replies==null)S.stats.replies=0;
  ensureQuests(); if(!S.topics.length) genTopics(); if(!S.sponsorOffers.length) genSponsors(); }

if(typeof window!=='undefined' && window.addEventListener){
window.addEventListener('DOMContentLoaded',()=>{
  const saved=load(); if(saved) LANG=saved.lang||'ru';
  buildOnboard();
  $('#startBtn').onclick=()=>{ sfx('click'); startGame(); };
  $('#langBtnOnb').onclick=()=>{ sfx('click'); toggleLang(); };
  $('#muteBtn').onclick=()=>{ S.muted=!S.muted; if(!S.muted) sfx('click'); render(); save(); };
  $('#settingsBtn').onclick=()=>{ sfx('click'); openSettings(); };
  window.addEventListener('mousemove',e=>{ lastPointer={x:e.clientX,y:e.clientY}; });
  window.addEventListener('pointerdown',e=>{ lastPointer={x:e.clientX,y:e.clientY}; });
  window.addEventListener('touchstart',e=>{ if(e.touches&&e.touches[0]) lastPointer={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
  window.addEventListener('keydown',e=>{ if(!S||$('#app').classList.contains('hidden')) return; const tag=(e.target&&e.target.tagName)||''; if(tag==='INPUT'||tag==='TEXTAREA') return;
    if(e.code==='Space'){ e.preventDefault(); const eCost=Math.round(VTYPES.normal.energy*(1-S.staff.editor*0.07)); makeVideo(S.energy>=eCost?'normal':'quick'); }
    else if(e.code==='KeyS'){ liveStream(); } else if(e.code==='KeyN'){ nextDay(); } });
  if(saved){ S=saved; migrate(); showGame(); }
});
}

</script>
</body>
