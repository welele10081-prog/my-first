<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TubeTycoon — Симулятор Ютубера</title>
<meta name="description" content="Мощный симулятор карьеры ютубера: видео, стримы, команда, конкуренты, квесты, престиж и play-кнопки.">
<style>
  :root{
    --bg:#080a08; --panel:#111511; --panel2:#161c16; --line:#242e24;
    --txt:#e6efe6; --muted:#8fa38f; --accent:#39d353; --accent2:#2ea043;
    --gold:#f2c14e; --silver:#c9d1d9; --diamond:#7ee3ff; --ruby:#ff5c7a; --purple:#c98bff;
    --danger:#ff6b6b; --warn:#ffcf5c; --radius:14px;
    --shadow:0 6px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(57,211,83,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(46,160,67,.08), transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    min-height:100vh; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .hidden{display:none !important}

  #onboard{max-width:740px;margin:5vh auto;padding:16px}
  .logo{font-size:clamp(28px,6vw,46px);font-weight:800;letter-spacing:-1px;text-align:center;margin:0 0 6px}
  .logo .play{color:var(--accent)}
  .tag{text-align:center;color:var(--muted);margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .field{margin:14px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
  input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:16px}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  .niches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
  .niche{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;text-align:center;transition:.15s;user-select:none}
  .niche:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .niche.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(57,211,83,.25) inset}
  .niche .em{font-size:26px;display:block}
  .niche .nm{font-weight:700;margin-top:4px}
  .niche .rp{font-size:11px;color:var(--muted)}

  .btn{cursor:pointer;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;background:var(--accent);color:#05230d;transition:.15s}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(1px)}
  .btn.block{width:100%;margin-top:18px;font-size:17px;padding:14px}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.sm{padding:8px 12px;font-size:13px}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  .btn.gold{background:var(--gold);color:#3a2a00}
  .btn.purple{background:var(--purple);color:#2a0a3a}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  header.top{position:sticky;top:0;z-index:20;background:rgba(8,10,8,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px}
  .brand{font-weight:800;font-size:18px;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .brand .play{color:var(--accent)}
  .brand .chip{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--purple)}
  .stats{display:flex;gap:13px;flex-wrap:wrap;flex:1;justify-content:flex-end}
  .stat{display:flex;flex-direction:column;align-items:flex-end;min-width:60px}
  .stat .v{font-weight:800;font-size:16px}
  .stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .stat .v.money{color:var(--gold)} .stat .v.subs{color:var(--accent)}
  .stat .v.rep{color:var(--diamond)} .stat .v.cr{color:var(--purple)}
  .hdr-tools{display:flex;gap:6px;align-items:center}
  .icobtn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:9px;padding:6px 9px;font-size:13px;font-weight:700}
  .icobtn:hover{border-color:var(--accent)}

  .energy-wrap{width:100%;max-width:240px}
  .energy-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px}
  .energy-bar{height:9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  .energy-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}

  .ticker{background:var(--panel);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
  .ticker .inner{display:inline-block;padding:6px 16px;font-size:13px;color:var(--muted)}
  .ticker b{color:var(--accent)}

  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:thin}
  nav.tabs button{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600}
  nav.tabs button.active{color:var(--txt);border-color:var(--accent);background:var(--panel2)}
  nav.tabs button .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:6px;font-size:11px;border-radius:8px;background:var(--danger);color:#fff}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .panel h2{margin:0 0 12px;font-size:18px}
  .panel h3{margin:16px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .muted{color:var(--muted)} .small{font-size:13px}

  .vtypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .vtype{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2);cursor:pointer;transition:.15s;position:relative}
  .vtype:hover{border-color:var(--accent);transform:translateY(-2px)}
  .vtype.stream{border-color:var(--ruby)} .vtype.stream:hover{border-color:var(--ruby)}
  .vtype .t{font-weight:800;font-size:16px} .vtype .d{font-size:12px;color:var(--muted);margin:6px 0}
  .vtype .cost{font-size:12px;color:var(--warn)}
  .vtype.disabled{opacity:.45;pointer-events:none}

  .item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:10px}
  .item .em{font-size:26px;width:34px;text-align:center}
  .item .info{flex:1;min-width:0} .item .info .nm{font-weight:700} .item .info .ds{font-size:12px;color:var(--muted)}
  .lvlbar{display:flex;gap:3px;margin-top:5px} .lvlbar .seg{height:6px;flex:1;border-radius:3px;background:var(--line)} .lvlbar .seg.on{background:var(--accent)}
  .item .buy{text-align:right;white-space:nowrap} .item .buy .price{font-size:12px;color:var(--gold);margin-bottom:5px}

  .feed{max-height:340px;overflow:auto;scrollbar-width:thin}
  .logline{padding:9px 12px;border-left:3px solid var(--line);margin-bottom:7px;background:var(--panel2);border-radius:0 8px 8px 0;font-size:14px}
  .logline.good{border-color:var(--accent)} .logline.bad{border-color:var(--danger)}
  .logline.viral{border-color:var(--gold);background:rgba(242,193,78,.08)} .logline.info{border-color:var(--diamond)}
  .logline .tm{font-size:11px;color:var(--muted);margin-right:6px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  td.num{text-align:right;font-variant-numeric:tabular-nums} tr .vir{color:var(--gold)}

  .lb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:8px}
  .lb-row.you{border-color:var(--accent);box-shadow:0 0 0 1px rgba(57,211,83,.2) inset}
  .lb-row .rk{font-weight:800;width:34px;color:var(--muted)} .lb-row.you .rk{color:var(--accent)}
  .lb-row .nm{flex:1;font-weight:700} .lb-row .sb{font-weight:800;color:var(--accent)}
  .lb-row .nn{font-size:11px;color:var(--muted);font-weight:400}

  .quest{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:10px}
  .quest .em{font-size:24px} .quest .info{flex:1}
  .qbar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
  .qbar .fill{height:100%;background:var(--accent);transition:width .3s}
  .quest .rew{color:var(--gold);font-weight:700;white-space:nowrap;font-size:13px}

  .achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .ach{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2);text-align:center;opacity:.4;transition:.2s}
  .ach.got{opacity:1;border-color:var(--accent)}
  .ach .em{font-size:30px} .ach .nm{font-weight:700;font-size:13px;margin-top:4px} .ach .ds{font-size:11px;color:var(--muted)}

  #toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
  .toast{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);font-weight:600;animation:pop .3s ease;max-width:100%}
  .toast.bad{border-color:var(--danger)} .toast.gold{border-color:var(--gold)} .toast.purple{border-color:var(--purple)}
  @keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
  #modal .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;max-width:480px;width:100%;box-shadow:var(--shadow)}
  #modal h3{margin:0 0 10px}
  #modal .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  #modal .actions .btn{flex:1;min-width:120px}

  canvas{width:100%;display:block;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
  .trend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(57,211,83,.08);border:1px solid var(--accent2);border-radius:10px;padding:8px 12px;font-size:14px}
  .trend .fire{font-size:18px}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .kpi .box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi .box .v{font-size:20px;font-weight:800} .kpi .box .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:20px 0}
  .prestige-box{border:1px solid var(--purple);background:rgba(201,139,255,.06)}

  /* ---------- UI 3.0: полировка и эффекты ---------- */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:90}
  .float-num{position:fixed;z-index:80;pointer-events:none;font-weight:800;font-size:15px;
    text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
  @keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-46px);opacity:0}}

  /* аватар канала */
  .avatar{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:21px;background:linear-gradient(135deg,var(--accent2),#0d3d1a);border:1px solid var(--accent);flex:0 0 auto}
  .avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:8px}
  .av-opt{cursor:pointer;aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:24px;transition:.15s;user-select:none}
  .av-opt:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .av-opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(57,211,83,.25) inset}

  /* ранг создателя */
  .rank{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--line);background:var(--panel2)}

  /* прогресс до следующей кнопки */
  .goalbar{margin-top:12px}
  .goalbar .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
  .goalbar .track{height:12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  .goalbar .fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:8px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

  /* трофейная полка */
  .shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
  .trophy{position:relative;text-align:center;border:1px solid var(--line);border-radius:14px;padding:14px 8px;background:var(--panel2);opacity:.35;filter:grayscale(1);transition:.3s}
  .trophy.got{opacity:1;filter:none;border-color:var(--gold);box-shadow:0 0 18px rgba(242,193,78,.15)}
  .trophy .big{font-size:34px;line-height:1}
  .trophy .lb{font-size:11px;color:var(--muted);margin-top:6px;font-weight:700}

  /* кнопки-плитки видео: анимация клика + иконки */
  .vtype{overflow:hidden}
  .vtype::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(57,211,83,.28),transparent 45%);opacity:0;transition:opacity .4s}
  .vtype:not(.disabled):active::after{opacity:1;transition:none}
  .vtype .big{font-size:22px;margin-bottom:2px}

  /* общая полировка */
  .btn{position:relative;overflow:hidden}
  .panel{animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  nav.tabs button{transition:.15s;position:relative}
  nav.tabs button.active::after{content:'';position:absolute;left:12px;right:12px;bottom:-4px;height:2px;background:var(--accent);border-radius:2px}
  .stat .v{transition:color .2s}
  .stat .v.bump{animation:bump .35s ease}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
  .lb-row{transition:.2s} .lb-row:hover{border-color:var(--accent2)}
  .kpi .box{transition:.2s} .kpi .box:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .hint-keys{font-size:11px;color:var(--muted);margin-top:8px}
  .hint-keys kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="onboard">
  <h1 class="logo"><span class="play">▶</span> TubeTycoon</h1>
  <p class="tag" data-i18n="tagline"></p>
  <div style="text-align:center;margin-bottom:14px">
    <button class="icobtn" id="langBtnOnb">🌐 RU / EN</button>
  </div>
  <div class="card">
    <div class="field"><label data-i18n="pickAvatar"></label>
      <div class="avatars" id="avatarGrid"></div></div>
    <div class="field"><label data-i18n="channelName"></label>
      <input type="text" id="chanName" maxlength="24" data-ph="channelPh"></div>
    <div class="field"><label data-i18n="yourNiche"></label>
      <div class="niches" id="nicheGrid"></div></div>
    <button class="btn block" id="startBtn" data-i18n="createChannel"></button>
  </div>
  <footer data-i18n="autosave"></footer>
</div>

<div id="game" class="hidden">
  <header class="top">
    <div class="wrap">
      <div class="brand"><span class="avatar" id="hdrAvatar">🎬</span> <span id="hdrName">Канал</span> <span class="rank" id="hdrRank"></span> <span class="chip hidden" id="hdrPrestige"></span></div>
      <div class="stats">
        <div class="stat"><span class="v subs" id="stSubs">0</span><span class="k" data-i18n="subs"></span></div>
        <div class="stat"><span class="v" id="stViews">0</span><span class="k" data-i18n="views"></span></div>
        <div class="stat"><span class="v money" id="stMoney">$0</span><span class="k" data-i18n="moneyK"></span></div>
        <div class="stat"><span class="v cr" id="stCreative">0</span><span class="k" data-i18n="creative"></span></div>
        <div class="stat"><span class="v rep" id="stRep">50</span><span class="k" data-i18n="rep"></span></div>
        <div class="stat"><span class="v" id="stDay">1</span><span class="k" data-i18n="day"></span></div>
      </div>
      <div class="hdr-tools">
        <button class="icobtn" id="muteBtn" title="sound">🔊</button>
        <button class="icobtn" id="langBtn">🌐</button>
      </div>
      <div class="energy-wrap">
        <div class="energy-top"><span>⚡ <span data-i18n="energy"></span></span><span id="enTxt">100/100</span></div>
        <div class="energy-bar"><div class="energy-fill" id="enFill" style="width:100%"></div></div>
      </div>
    </div>
  </header>
  <div class="ticker"><div class="inner" id="ticker">…</div></div>

  <div class="wrap">
    <nav class="tabs" id="tabs"></nav>
    <div id="tabContent"></div>
    <footer>
      <button class="btn ghost sm" id="saveBtn">💾 <span data-i18n="save"></span></button>
      <button class="btn danger sm" id="resetBtn">🗑 <span data-i18n="reset"></span></button>
    </footer>
  </div>
</div>

<div id="toasts"></div>
<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>

<script>
"use strict";
/* =========================================================================
   TubeTycoon — расширенный симулятор ютубера.
   Возможности: видео + стримы, магазин студии, навыки, команда (idle-бонусы),
   алгоритм рекомендаций, тренды, вирусы, сюжетные события с цепочками,
   конкуренты + рейтинг, квесты, престиж (новый канал), звук, RU/EN.
   ========================================================================= */

/* ----------------------------- i18n словарь ----------------------------- */
const DICT = {
  ru:{
    tagline:'Стань ютубером с нуля. Видео, стримы, команда, конкуренты, престиж.',
    channelName:'Название канала', channelPh:'Например: Дикая Природа',
    yourNiche:'Твоя ниша', createChannel:'Создать канал ▶',
    autosave:'Прогресс сохраняется автоматически в этом браузере.',
    subs:'Подписчики', views:'Просмотры', moneyK:'Деньги', creative:'Креатив', rep:'Репутация',
    day:'День', energy:'Энергия', save:'Сохранить', reset:'Сбросить прогресс',
    t_studio:'🎬 Студия', t_shop:'🛒 Магазин', t_skills:'📈 Навыки', t_team:'👥 Команда',
    t_videos:'📼 Видео', t_quests:'🎯 Квесты', t_events:'📨 События', t_rivals:'🏆 Рейтинг', t_channel:'📊 Канал',
    makeVideo:'Снять видео', nextDay:'💤 Следующий день (энергия +100%)', promo:'📣 Реклама канала',
    feed:'📰 Лента', feedEmpty:'Пока пусто. Сними первое видео!',
    shopTitle:'🛒 Магазин оборудования', shopHint:'Оборудование повышает качество роликов и охваты. Компьютер также поднимает максимум энергии.',
    skillsTitle:'📈 Навыки', skillsHint:'Прокачка тратит деньги и 20 энергии. Навыки — главный множитель роста.',
    teamTitle:'👥 Команда', teamHint:'Наёмники дают пассивные бонусы: экономят энергию, повышают качество, приносят доход и защищают от хейта.',

let lastPointer = {x: (typeof innerWidth!=='undefined'?innerWidth/2:200), y:160};
let confParts=[], confRAF=0;
function confetti(power){
  if(typeof requestAnimationFrame==='undefined') return;
  const cv=$('#fx'); if(!cv||!cv.getContext) return;
  cv.width=innerWidth; cv.height=innerHeight; const ctx=cv.getContext('2d');
  const cols=['#39d353','#f2c14e','#7ee3ff','#ff5c7a','#c98bff','#ffffff'];
  const n=power||90;
  for(let i=0;i<n;i++) confParts.push({x:innerWidth/2+rnd(-90,90), y:innerHeight*0.32,
    vx:rnd(-6,6), vy:rnd(-13,-4), g:rnd(0.22,0.4), s:rnd(4,9), c:pick(cols), r:rnd(0,6.28), vr:rnd(-0.3,0.3), life:rnd(60,110)});
  if(!confRAF){
    const step=()=>{ ctx.clearRect(0,0,cv.width,cv.height);
      confParts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.globalAlpha=clamp(p.life/40,0,1);
        ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); });
      confParts=confParts.filter(p=>p.life>0 && p.y<cv.height+20);
      if(confParts.length){ confRAF=requestAnimationFrame(step); } else { confRAF=0; ctx.clearRect(0,0,cv.width,cv.height); } };
    confRAF=requestAnimationFrame(step);
  }
}

  if(to>from){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  const t0=performance.now(), dur=450;
  const tick=now=>{ const p=clamp((now-t0)/dur,0,1); const v=from+(to-from)*(1-Math.pow(1-p,3));
    el.textContent=(isMoney?'$':'')+fmt(v); if(p<1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

const QUEST_KINDS = ['subs','videos','viral','stream','skill','money'];
function genQuest(){
  const kind = pick(QUEST_KINDS);
  let target, reward, base;
  switch(kind){
    case 'subs':   target = Math.max(100, Math.round(S.subs*1.5 + rint(50,300))); reward=Math.round(target*0.5)+200; base=S.subs; break;
    case 'videos': target = S.stats.videosMade + rint(3,8); reward=rint(150,600); base=S.stats.videosMade; break;
    case 'viral':  target = S.stats.virals + 1; reward=rint(500,1500); base=S.stats.virals; break;
    case 'stream': target = S.stats.streams + rint(1,3); reward=rint(300,900); base=S.stats.streams; break;
    case 'skill':  target = clamp(Math.max(...Object.values(S.skills))+2, 2, SKILL_MAX); reward=rint(300,800); base=0; break;
    case 'money':  target = Math.round(S.money + rint(500,3000)); reward=Math.round(target*0.3); base=S.money; break;
  }
  return {kind, target, reward, done:false};
}
function questProgress(q){
  switch(q.kind){
    case 'subs':   return S.subs;
    case 'videos': return S.stats.videosMade;
    case 'viral':  return S.stats.virals;
    case 'stream': return S.stats.streams;
    case 'skill':  return Math.max(...Object.values(S.skills));
    case 'money':  return S.money;
  }
  return 0;
}
function questLabel(q){ return tf('qk_'+q.kind,{n:fmt(q.target)}); }
function ensureQuests(){ while(S.quests.length<3) S.quests.push(genQuest()); }
function checkQuests(){
  let changed=false;
  S.quests.forEach((q,i)=>{
    if(!q.done && questProgress(q)>=q.target){
      q.done=true; S.money+=q.reward; S.questsDone++;
      log(`🎯 ${LANG==='ru'?'Квест выполнен':'Quest done'}: ${questLabel(q)} (+${money(q.reward)})`,'good');
      toast('🎯 '+(LANG==='ru'?'Квест выполнен!':'Quest done!'),'gold'); sfx('coin');
      if(S.questsDone>=5) grantAch('quest5');
      S.quests[i]=genQuest(); changed=true;
    }
  });
  ensureQuests();
  return changed;
}

/* ============================ ДВИЖОК: ВИДЕО ============================ */
function avgEquip(){ const e=S.equip; return (e.camera+e.mic+e.pc+e.light+e.soft+e.studio*1.5)/7.5; }
function makeVideo(typeKey){
  const T = VTYPES[typeKey];
  const eCost = Math.round(T.energy * (1 - S.staff.editor*0.07));
  if(S.energy < eCost){ toast(t('lowEnergy'),'bad'); sfx('error'); return; }
  S.energy -= eCost;

  const N=NICHES[S.niche], sk=S.skills, eq=avgEquip();
  let q = 1.4 + eq*0.62 + sk.editing*0.34 + sk.writing*0.22 + sk.charisma*0.12
        + T.effort*1.8 + S.staff.editor*0.15 + S.staff.writer*0.1 + rnd(-1.4,1.6);
  q = clamp(q, 0.4, 18);

  const trendMatch = (S.trend===S.niche);
  const trendBonus = trendMatch ? 1.85 : 1.0;
  const seoF = (1 + sk.seo*0.16) * N.disc;
  const ctr  = (1 + sk.thumb*0.13) * (1 + S.staff.designer*0.05);
  const repF = 0.7 + S.rep/100;
  const authority = 1 + Math.pow(S.subs, 0.5)/26;

  let viralRoll=1, viral=false;
  const r=Math.random();
  const viralChance = 0.02 + sk.writing*0.004 + S.staff.writer*0.005 + (trendMatch?0.03:0);
  if(r<viralChance){ viralRoll=rnd(9,42); viral=true; }
  else if(r<0.18)  { viralRoll=rnd(1.6,3.2); }
  else             { viralRoll=rnd(0.7,1.35); }

  const discovery = Math.pow(q,1.85) * (13 + sk.seo*9) * seoF * ctr * trendBonus * viralRoll * repF * authority * pmult();
  const subReach  = S.subs * clamp(0.20 + q*0.02, 0.12, 0.6);
  let views = Math.max(Math.round(discovery + subReach), rint(5,40));

  const saturation = clamp(1 - S.subs/2e9, 0.02, 1);
  let appeal = clamp(q*0.004 * N.appeal * (1 + sk.charisma*0.07) * ctr, 0.002, 0.09);
  let dSubs = Math.round(discovery * appeal * saturation);
  if(q<3 && S.subs>50){ dSubs -= Math.round(S.subs*0.008*(3-q)); }
  dSubs = Math.max(dSubs, -Math.round(S.subs*0.05));

  const likes = Math.round(views*(0.018+q*0.004));
  const adBonus = 1 + S.equip.soft*0.03;
  let earned = S.monetized ? Math.round(views/1000*N.rpm*adBonus*pmult())
                           : Math.round(views/1000*N.rpm*0.12);

  S.views+=views; S.subs=Math.max(0,S.subs+dSubs); S.money+=earned; S.creative+=T.cr;
  S.rep=clamp(S.rep + (q>7?1:q<3?-2:0) + (viral?2:0), 0, 100);
  S.stats.videosMade++; if(viral) S.stats.virals++; if(views>S.stats.bestViews) S.stats.bestViews=views;

  const title = pick(N.titles[LANG]||N.titles.ru);
  S.videos.unshift({title,niche:S.niche,type:typeKey,views,subs:dSubs,likes,money:earned,day:S.day,viral,q:+q.toFixed(1)});
  if(S.videos.length>60) S.videos.pop();

  if(viral){ log(`🔥 ${LANG==='ru'?'ВИРУС':'VIRAL'}! «${title}» — ${fmt(views)} ${t('views').toLowerCase()}, +${fmt(dSubs)}!`,'viral');
    toast(LANG==='ru'?'🔥 ВИДЕО ВЗОРВАЛОСЬ!':'🔥 IT WENT VIRAL!','gold'); sfx('viral'); grantAch('viral'); confetti(140); }
  else { log(`«${title}» — ${fmt(views)} ${t('views').toLowerCase()}, ${dSubs>=0?'+':''}${fmt(dSubs)}, ${money(earned)}`, dSubs>=0?'good':'bad'); sfx('publish'); }
  floatNum((dSubs>=0?'+':'')+fmt(dSubs)+' 👤', dSubs>=0?'var(--accent)':'var(--danger)');
  if(earned>0) setTimeout(()=>floatNum('+'+money(earned),'var(--gold)'),120);

  grantAch('first'); checkMilestones(); maybeEvent(views,q); checkQuests();
  S.history.push(S.subs); if(S.history.length>140) S.history.shift();
  render(); save();
}

function liveStream(){
  if(S.subs<100){ toast(t('streamLocked'),'bad'); sfx('error'); return; }
  if(S.energy<30){ toast(t('lowEnergy'),'bad'); sfx('error'); return; }
  S.energy-=30;
  const N=NICHES[S.niche];

  const superchat = Math.round(viewers*rnd(0.02,0.08)*(1+S.skills.charisma*0.1)) + rint(5,50);
  const dSubs = Math.round(viewers*rnd(0.01,0.05));
  S.views+=viewers; S.money+=superchat; S.subs+=dSubs; S.stats.streams++;
  S.rep=clamp(S.rep+1,0,100);
  log(`🔴 ${LANG==='ru'?'Стрим':'Stream'}: ${fmt(viewers)} ${LANG==='ru'?'зрителей':'viewers'}, +${fmt(dSubs)}, ${money(superchat)} ${LANG==='ru'?'донатов':'donations'}.`,'good');
  toast('🔴 '+money(superchat)+' 💰','gold'); sfx('stream');

  grantAch('stream'); checkMilestones(); checkQuests();
  S.history.push(S.subs); if(S.history.length>140) S.history.shift();
  render(); save();
}

  if(S.money<c){ toast(t('lowMoney'),'bad'); sfx('error'); return; } S.money-=c; S.staff[k]++;
  log((LANG==='ru'?'Нанят: ':'Hired: ')+L(STAFF[k].nm)+' → '+t('lvl')+S.staff[k],'good'); toast('👥 '+L(STAFF[k].nm)); sfx('coin'); grantAch('team'); render(); save(); }

function growRivals(){
  // сублинейный рост: конкуренты сильны, но не улетают в бесконечную экспоненту
  S.rivals.forEach(r=>{
    const viral = Math.random()<0.04 ? rnd(1.2,1.8) : 1;
    const grow = Math.pow(Math.max(r.subs,1),0.72) * r.g * 22 * rnd(0.6,1.4) * viral + rint(10,140);
    r.subs = Math.round(r.subs + grow);
  });
}
function checkNo1(){ const top=Math.max(...S.rivals.map(r=>r.subs)); if(S.subs>top && S.subs>0){ if(!S.wasNo1){ S.wasNo1=true; grantAch('no1'); toast('👑 #1!','gold'); log(LANG==='ru'?'👑 Ты №1 в рейтинге!':'👑 You are #1!','viral'); confetti(160); } } }
function collabRival(name){
  const r=S.rivals.find(x=>x.name===name); if(!r) return;
  if(r.cd && S.day<r.cd){ toast(t('collabCooldown'),'bad'); sfx('error'); return; }
  if(S.energy<30){ toast(t('lowEnergy'),'bad'); sfx('error'); return; }
  S.energy-=30; r.cd=S.day+3;
  const g=Math.round(Math.min(r.subs*rnd(0.02,0.06), S.subs*2+5000))+rint(30,300);
  const v=g*rint(3,7); S.subs+=g; S.views+=v; S.rep=clamp(S.rep+2,0,100); S.collabDone=true;
  grantAch('collab'); log('🤝 '+(LANG==='ru'?'Коллаб с ':'Collab with ')+r.name+': +'+fmt(g),'good');
  toast('🤝 +'+fmt(g),'gold'); sfx('coin'); floatNum('+'+fmt(g)+' 👤','var(--accent)');
  checkMilestones(); checkQuests(); S.history.push(S.subs); if(S.history.length>140)S.history.shift(); render(); save();
}

  const drift=Math.round(S.subs*((S.rep-50)/100)*0.004); if(drift!==0) S.subs=Math.max(0,S.subs+drift);
  if(S.staff.manager>0){ const inc=Math.round(S.subs*0.02*S.staff.manager*(S.monetized?1:0.2)*pmult()); if(inc>0){ S.money+=inc; log('💼 '+(LANG==='ru'?'Менеджер принёс ':'Manager brought ')+money(inc),'good'); } }
  if(S.trendDays>0){ S.trendDays--; if(S.trendDays===0){ S.trend=null; log(LANG==='ru'?'Тренд угас.':'Trend faded.','info'); } }
  else if(Math.random()<0.35){ S.trend=pick(Object.keys(NICHES)); S.trendDays=rint(2,4);
    log('📈 '+(LANG==='ru'?'Новый тренд: ':'New trend: ')+NICHES[S.trend].em+' '+L(NICHES[S.trend].nm)+(S.trend===S.niche?(LANG==='ru'?' — твоя ниша!':' — your niche!'):''),'info'); }
  growRivals(); checkNo1(); checkQuests();
  log('— '+t('day')+' '+S.day+'.','info');
  S.history.push(S.subs); if(S.history.length>140) S.history.shift();

}
function promoteCost(){ return Math.round(40+S.subs*0.25); }
function promote(){ const c=promoteCost(); if(S.money<c){ toast(t('lowMoney'),'bad'); sfx('error'); return; }

function drawChart(){ const cv=$('#chart'); if(!cv||!cv.getContext) return; const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H); const d=S.history; if(d.length<2) return; const max=Math.max(...d,1),pad=10;
  ctx.beginPath(); d.forEach((v,i)=>{ const x=pad+(W-2*pad)*i/(d.length-1), y=H-pad-(H-2*pad)*(v/max); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle='#39d353'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
  ctx.lineTo(pad+(W-2*pad),H-pad); ctx.lineTo(pad,H-pad); ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(57,211,83,.35)'); g.addColorStop(1,'rgba(57,211,83,0)'); ctx.fillStyle=g; ctx.fill(); }

  const extra = top?`👑 ${LANG==='ru'?'Лидер':'Leader'}: <b>${top.name}</b> (${fmt(top.subs)})` : '';
  const arr = extra?pool.concat([extra]):pool; return arr[tickI%arr.length]; }
function startTicker(){ const el=$('#ticker'); if(!el) return; const upd=()=>{ if(!S) return; el.innerHTML='📢 '+tickerLine(); tickI++; }; upd(); setInterval(upd, 6000); }

/* ============================ ONBOARDING ============================ */
let selNiche=null, selAvatar='🎬';
function buildOnboard(){
  const ag=$('#avatarGrid');
  if(ag){ ag.innerHTML=AVATARS.map(a=>`<div class="av-opt ${a===selAvatar?'sel':''}" data-a="${a}">${a}</div>`).join('');
    ag.querySelectorAll('.av-opt').forEach(el=>el.onclick=()=>{ sfx('click'); ag.querySelectorAll('.av-opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); selAvatar=el.dataset.a; }); }
  const grid=$('#nicheGrid');
  grid.innerHTML=Object.entries(NICHES).map(([k,n])=>`<div class="niche ${k===selNiche?'sel':''}" data-n="${k}"><span class="em">${n.em}</span><span class="nm">${L(n.nm)}</span><span class="rp">RPM $${n.rpm}</span></div>`).join('');
  grid.querySelectorAll('.niche').forEach(el=>el.onclick=()=>{ sfx('click'); grid.querySelectorAll('.niche').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); selNiche=el.dataset.n; });
  applyStatic();
}
function startGame(){ const nm=$('#chanName').value.trim()||(LANG==='ru'?'Мой канал':'My channel'); if(!selNiche){ toast(t('pickNiche'),'bad'); sfx('error'); return; }
  S=freshState(nm,selNiche); S.avatar=selAvatar; ensureQuests(); log((LANG==='ru'?'Канал «':'Channel “')+nm+(LANG==='ru'?'» создан. Удачи! 🎬':'” created. Good luck! 🎬'),'good'); save(); showGame(); }
function showGame(){ $('#onboard').classList.add('hidden'); $('#game').classList.remove('hidden'); buildTabs(); render(); startTicker(); }
function confirmModal(title,text,onYes){ const box=$('#modalBox');
  box.innerHTML=`<h3>${title}</h3><p>${text}</p><div class="actions"><button class="btn danger" id="mNo">${t('cancel')}</button><button class="btn" id="mYes">${t('yes')}</button></div>`;
  $('#modal').classList.remove('hidden'); $('#mNo').onclick=()=>$('#modal').classList.add('hidden'); $('#mYes').onclick=()=>{ $('#modal').classList.add('hidden'); onYes(); }; }
function toggleLang(){ LANG=LANG==='ru'?'en':'ru'; if(S) S.lang=LANG; if(S){ buildTabs(); render(); } else { buildOnboard(); } save&&S&&save(); }

window.addEventListener('DOMContentLoaded',()=>{
  const saved=load();
  if(saved){ LANG=saved.lang||'ru'; }
  buildOnboard();
  $('#startBtn').onclick=()=>{ sfx('click'); startGame(); };
  $('#langBtnOnb').onclick=()=>{ sfx('click'); toggleLang(); };
  $('#langBtn').onclick=()=>{ sfx('click'); toggleLang(); };
  $('#muteBtn').onclick=()=>{ S.muted=!S.muted; if(!S.muted) sfx('click'); render(); save(); };
  $('#saveBtn').onclick=()=>{ save(); toast(t('saved')); };
  $('#resetBtn').onclick=()=>confirmModal(t('resetQ'),t('resetT'),()=>{ localStorage.removeItem(SAVE_KEY); location.reload(); });
  window.addEventListener('mousemove',e=>{ lastPointer={x:e.clientX,y:e.clientY}; });
  window.addEventListener('pointerdown',e=>{ lastPointer={x:e.clientX,y:e.clientY}; });
  window.addEventListener('touchstart',e=>{ if(e.touches&&e.touches[0]) lastPointer={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
  window.addEventListener('keydown',e=>{
    if(!S || $('#game').classList.contains('hidden')) return;
    const tag=(e.target&&e.target.tagName)||''; if(tag==='INPUT'||tag==='TEXTAREA') return;
    if(e.code==='Space'){ e.preventDefault(); const eCost=Math.round(VTYPES.normal.energy*(1-S.staff.editor*0.07)); makeVideo(S.energy>=eCost?'normal':'quick'); }
    else if(e.code==='KeyS'){ liveStream(); }
    else if(e.code==='KeyN'){ nextDay(); }
  });
  if(saved){ S=saved; S.avatar=S.avatar||'🎬';
    // миграция полей из старых сейвов
    S.staff=S.staff||{editor:0,designer:0,writer:0,manager:0,moderator:0};
    S.rivals=S.rivals&&S.rivals.length?S.rivals:makeRivals();
    S.quests=S.quests||[]; S.questsDone=S.questsDone||0; S.prestige=S.prestige||0; S.permaBonus=S.permaBonus||0;
    S.stats=S.stats||{videosMade:0,virals:0,strikes:0,bestViews:0,streams:0}; if(S.stats.streams===undefined)S.stats.streams=0;
    ensureQuests(); showGame(); }
});
</script>
